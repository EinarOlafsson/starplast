# starplast without the CUDA stack, under a name that says so.
#
#     pip install starplast-cpu
#
# It installs `starplast-core` -- the code -- and nothing else. `pip install starplast` carries the
# CUDA stack by default, so this is the name for saying no to two gigabytes of wheels on a machine
# with no card. The import name is `starplast` either way.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starplast-cpu"
version = "0.24.1"
description = "starplast without the CUDA stack: the program alone"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Einar Olafsson", email = "einar.olafsson@gmail.com"}]
dependencies = ["starplast-core==0.24.1"]

[project.urls]
Homepage = "https://github.com/EinarOlafsson/starplast"

[tool.setuptools]
packages = []
