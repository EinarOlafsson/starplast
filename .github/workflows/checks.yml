name: Tests

on:
  push:
    branches: [main, nightly]
  pull_request:
    branches: [main, nightly]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYQTGRAPH_QT_LIB: PyQt6
      STARPLAST_STATE: /tmp/starplast-checks
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      NUMBA_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0 xvfb xauth
      - run: python -m pip install '.[dev]'
      - name: Check synchronized package versions and regressions
        run: |
          python scripts/release.py check
          python -m pytest -m "not slow" -q
      - name: Render species switches with a real OpenGL context
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s '-screen 0 1920x1200x24' python -m pytest tests/test_app_contexts.py -q
