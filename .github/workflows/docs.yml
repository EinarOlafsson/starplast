name: API reference

# The docstrings in this project carry the reasoning, not just the signatures, so the generated page is
# genuinely the reference -- there is no second prose document to keep in step with it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The GUI modules import PyQt6 at module scope, and pdoc imports every module to read it.
          pip install -e . pdoc PyQt6 pyqtgraph
      - name: Build the API reference
        env:
          # pdoc imports each module; the Qt ones need a platform that exists on a headless runner.
          QT_QPA_PLATFORM: offscreen
          PYQTGRAPH_QT_LIB: PyQt6
        run: python -m pdoc --output-directory docs/api --no-search --docformat markdown starplast
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
