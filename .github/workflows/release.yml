name: Publish Python packages

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - packaging/starplast/pyproject.toml
      - packaging/starplast-gpu/pyproject.toml
      - starplast/__init__.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install packaging
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          PREVIOUS: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = push ]; then
            python scripts/release.py detect --previous "$PREVIOUS" --output "$GITHUB_OUTPUT"
          else
            python scripts/release.py detect --output "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYQTGRAPH_QT_LIB: PyQt6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install '.[dev]'
      - name: Release checks
        run: |
          python scripts/release.py check
          python -m pytest tests/test_release.py tests/test_packaging.py tests/test_readme.py tests/test_docstrings.py tests/test_paths.py tests/test_app_smoke.py tests/test_app_polish.py tests/test_discover_cli.py tests/test_importer.py -q
      - name: Build wheels and source distributions
        run: |
          python -m build
          python -m build packaging/starplast --outdir dist
          python -m build packaging/starplast-gpu --outdir dist
          python scripts/check_wheel.py dist
          python -m twine check --strict dist/*
      - name: Smoke test installed wheel outside the checkout
        run: |
          python -m venv --system-site-packages /tmp/starplast-wheel
          /tmp/starplast-wheel/bin/python -m pip install --no-deps --force-reinstall dist/*.whl
          cd /tmp
          /tmp/starplast-wheel/bin/python -I -c 'from starplast import paths; from starplast.app import load; assert paths.check()[0]; assert len(load()[0]) > 1000'
          /tmp/starplast-wheel/bin/starplast-discover --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/starplast/${{ needs.version.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
