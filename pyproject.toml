[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# The CODE lives here, under a name nobody has to type. `pip install starplast` and
# `pip install starplast-cpu` are both thin metapackages in packaging/ that depend on this one, so
# that the default install can carry the CUDA stack while the -cpu name can leave it out. Neither
# is possible with a single distribution: dependencies are fixed when a wheel is built, so one name
# cannot install two dependency sets, and a -cpu package that depended on a GPU-carrying starplast
# would still drag the CUDA wheels in.
name = "starplast-core"
version = "0.33.0"
description = "A 3D browser for the Toxoplasma gondii knowledge map (the code; install starplast)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Einar Olafsson", email = "einar.olafsson@gmail.com"}]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12",
    "PyQt6>=6.5",
    "pyqtgraph>=0.13",
    "PyOpenGL>=3.1",
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Reading coverage tracks, for the two chromatin datasets GEO serves as bigWig and nothing
# else. Build-time only: `starplast.chromatin` imports it inside the function that needs it,
# so the shipped cache -- which already carries the computed columns -- loads without it.
#
#     pip install "starplast[ingest]"
ingest = ["pyBigWig>=0.3"]
# The GPU stack, as an extra rather than a dependency: it is ~2 GB of CUDA wheels, it only exists
# for CUDA 12, and the program runs identically without it -- `starplast.gpu` reports what it found
# and falls back. cuml does UMAP and HDBSCAN themselves; cupy does the array work.
#
#     pip install "starplast[gpu]"          from PyPI
#     pip install -e ".[gpu]"               in this checkout, editable
#     pip install starplast-gpu             the same thing under a name that reads as a product
#
# Both RAPIDS and CuPy publish to PyPI proper now, so no --extra-index-url is needed. Pinned to
# CUDA 12 because that is what the driver on this machine serves and what torch was built against;
# a CUDA 13 box wants cuml-cu13 and cupy-cuda13x.
gpu = [
    "cuml-cu12>=24.10",
    "cupy-cuda12x>=13.0",
]

[project.scripts]
starplast = "starplast.app:main"
# A search is a batch job that happens to have a GUI, not a GUI feature. On a server with no
# display the window is not merely unnecessary, it cannot be imported.
starplast-discover = "starplast.discover:main"
# Detection belongs here rather than in the installer: a wheel's dependencies are fixed when it is
# built, and there is no environment marker for "this machine has an NVIDIA card". See install_gpu.
starplast-install-gpu = "starplast.install_gpu:main"

[project.urls]
Homepage = "https://github.com/EinarOlafsson/starplast"

[tool.setuptools]
packages = ["starplast"]

[tool.setuptools.package-data]
starplast = ["data/*.npz", "data/*.parquet", "data/*.tsv", "data/*.json", "data/**/*.parquet", "data/**/*.md"]

[tool.pytest.ini_options]
markers = [
    "slow: runs a real build or a full documentation pass; minutes rather than seconds",
]
